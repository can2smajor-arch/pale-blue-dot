<script>
// ═════════ 단위 ═════════
const AU_KM = 149597870.7, C_KMS = 299792.458, LIGHT_AU_S = AU_KM / C_KMS;   // 1AU를 빛이 가는 데 499초
const LY_AU = 63241.077, LY_KM = LY_AU * AU_KM, YR = 365.25 * 86400;
const D2R = Math.PI / 180;
const jd = ms => ms / 86400000 + 2440587.5;
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ═════════ 행성 계산 (NASA JPL 근사 궤도요소, 1800~2050년에 잘 맞음) ═════════
const EL = {
  mercury:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593, 0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],
  venus:  [0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255, 0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418],
  earth:  [1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0, 0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0],
  mars:   [1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891, 0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343],
  jupiter:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909, -0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106],
  saturn: [9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448, -0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794],
  uranus: [19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503, -0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589],
  neptune:[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574, 0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664],
  pluto:  [39.48211675,0.24882730,17.14001206,238.92903833,224.06891629,110.30393684, -0.00031596,0.00005170,0.00004818,145.20780515,-0.04062942,-0.01183482]
};
function elemsAt(key, T){
  const e = EL[key];
  return { a: e[0]+e[6]*T, e: e[1]+e[7]*T, I: (e[2]+e[8]*T)*D2R, L: e[3]+e[9]*T, wb: e[4]+e[10]*T, Om: (e[5]+e[11]*T)*D2R };
}
function posFrom(el, Mdeg){
  const { a, e, I, Om } = el, w = el.wb * D2R - Om;
  let M = ((Mdeg % 360) + 540) % 360 - 180; M *= D2R;
  let E = M + e * Math.sin(M);
  for (let i = 0; i < 8; i++) E -= (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  const xp = a*(Math.cos(E) - e), yp = a*Math.sqrt(1 - e*e)*Math.sin(E);
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(Om), sO = Math.sin(Om), cI = Math.cos(I), sI = Math.sin(I);
  return { x: (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp, y: (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp, z: (sw*sI)*xp + (cw*sI)*yp };
}
function planetPos(key, ms){ const T = (jd(ms) - 2451545) / 36525, el = elemsAt(key, T); return posFrom(el, el.L - el.wb); }
function orbitPts(key, ms, n = 240){ const T = (jd(ms) - 2451545) / 36525, el = elemsAt(key, T), pts = []; for (let i = 0; i <= n; i++) pts.push(posFrom(el, i * 360 / n)); return pts; }
function moonOffset(ms){
  const d = jd(ms) - 2451545, M = (134.963 + 13.064993*d) * D2R, L = (218.316 + 13.176396*d) * D2R;
  const lon = L + 6.289*D2R*Math.sin(M), km = 385001 - 20905*Math.cos(M);
  return { x: Math.cos(lon)*km/AU_KM, y: Math.sin(lon)*km/AU_KM, z: 0, km };
}
// 보이저 (방향은 황도좌표, 거리는 2025-01-01 추정값 + 해마다 증가)
const VOY = { voyager1: { lon: 255.9, lat: 34.9, au0: 165.0, rate: 3.58 }, voyager2: { lon: 290.3, lat: -38.3, au0: 138.0, rate: 3.22 } };
function voyPos(key, ms){
  const v = VOY[key], r = v.au0 + v.rate * (ms - Date.UTC(2025,0,1)) / (YR*1000);
  return { x: r*Math.cos(v.lat*D2R)*Math.cos(v.lon*D2R), y: r*Math.cos(v.lat*D2R)*Math.sin(v.lon*D2R), z: r*Math.sin(v.lat*D2R), r };
}
// 적경·적위 → 황도좌표 (태양계 지도와 같은 방향으로 놓기)
function eqToPos(raH, decD, ly){
  const a = raH*15*D2R, d = decD*D2R, e = 23.4393*D2R;
  const b = Math.asin(Math.sin(d)*Math.cos(e) - Math.cos(d)*Math.sin(e)*Math.sin(a));
  const l = Math.atan2(Math.sin(a)*Math.cos(e) + Math.tan(d)*Math.sin(e), Math.cos(a));
  const r = ly * LY_AU;
  return { x: r*Math.cos(b)*Math.cos(l), y: r*Math.cos(b)*Math.sin(l), z: r*Math.sin(b) };
}

const fmtNum = n => n.toLocaleString("ko-KR", { maximumFractionDigits: 0 });
function big(n, unit){
  const f = (v, u) => (v < 10 ? v.toFixed(1).replace(/\.0$/, "") : fmtNum(v)) + u;
  if (n >= 1e16) return f(n/1e16, "경 " + unit);
  if (n >= 1e12) return f(n/1e12, "조 " + unit);
  if (n >= 1e8) return f(n/1e8, "억 " + unit);
  if (n >= 1e4) return f(n/1e4, "만 " + unit);
  return (n < 10 ? n.toFixed(1).replace(/\.0$/, "") : fmtNum(n)) + " " + unit;
}
const fmtKm = km => big(km, "km");
const fmtLy = ly => big(ly, "광년");

function fmtYears(y){ if (y < 1) return Math.max(1, Math.round(y*365)) + "일"; return big(y, "년").replace(" 년", "년"); }
function fmtDur(sec){
  if (sec >= YR) return fmtYears(sec / YR);
  if (sec < 1) return sec.toFixed(2) + "초";
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  if (d) return `${d}일 ${h}시간`; if (h) return `${h}시간 ${m}분`; if (m) return `${m}분 ${s}초`; return `${s}초`;
}

function makeSpiral(seed, arms, tint){
  const S = 900, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), r = rng(seed), C = S/2;

  glow.addColorStop(0, "rgba(255,236,190,.95)"); glow.addColorStop(.08, "rgba(255,220,160,.55)");
  glow.addColorStop(.35, `rgba(${tint},.16)`); glow.addColorStop(1, `rgba(${tint},0)`);
  g.fillStyle = glow; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 16000; i++){
    const arm = i % arms, f = Math.pow(r(), 0.75) * 0.97 + 0.03;
    const th = arm * 2*Math.PI/arms + 4.4*f + (r() - .5) * 0.55 / (f + .25);
    const rr = f * C * (0.96 + r()*0.08), x = C + Math.cos(th)*rr, y = C + Math.sin(th)*rr;
    const hot = r();
    g.fillStyle = hot < .06 ? "rgba(255,140,190,.8)" : f < .25 ? "rgba(255,230,180,.7)" : hot < .5 ? `rgba(${tint},.75)` : "rgba(255,255,255,.6)";
    const sz = r() < .97 ? 1.2 : 2.4; g.fillRect(x, y, sz, sz);
  }
  for (let i = 0; i < 2500; i++){ const a = r()*7, rr = Math.pow(r(), 2) * C*.95; g.fillStyle = "rgba(255,240,210,.35)"; g.fillRect(C + Math.cos(a)*rr, C + Math.sin(a)*rr, 1, 1); }
  return c;
}

const pts = new Map(); let moved = 0, pinch = null, dragging = false, vel = { x: 0, y: 0 }, lastMove = 0;

const pmid = () => { const [a, b] = [...pts.values()]; return [(a.x + b.x)/2, (a.y + b.y)/2]; };

function pDown(id, x, y){ pts.set(id, { x, y, x0: x, y0: y }); flight = null; vel = { x: 0, y: 0 };

  const g = document.getElementById("goLight"); if (g) g.onclick = () => startTrip(k);
}
setInterval(() => { if (selected && card.className === "show" && SOLAR.has(selected)) renderCard(); }, 2000);

// ═════════ 빛의 속도 여행 ═════════
const SPEEDS = [[1,"실제 속도"],[60,"1분/초"],[3600,"1시간/초"],[86400,"1일/초"],[YR,"1년/초"],[100*YR,"100년/초"],[1e4*YR,"1만 년/초"],[1e5*YR,"10만 년/초"],[1e6*YR,"100만 년/초"]];
let trip = null;
const hud = document.getElementById("hud"), toast = document.getElementById("toast");
function showToast(t){ toast.textContent = t; toast.style.opacity = 1; clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.style.opacity = 0, 2600); }
const MARKS = [[120, "태양권 경계 통과 · 이제 성간 우주"], [2000, "오르트 구름 안쪽 진입"], [LY_AU, "1광년 지점 통과"], [1e5, "오르트 구름을 벗어났어요"]];
function startTrip(k){
  const from = { ...pos.earth }, to = { ...pos[k] }, total = dist3(to, from), sec = total * LIGHT_AU_S;
  let si = SPEEDS.findIndex(([v]) => sec / v <= 25); if (si < 0) si = SPEEDS.length - 1;
  trip = { k, from, to, total, t: 0, si, p: { ...from }, cam: true, passed: new Set(["earth"]), marks: new Set(), done: false };
  for (const p of PLANETS) if (Math.hypot(from.x, from.y) > EL[p][0]) trip.passed.add(p);
  follow = null; timeRate = 0; document.querySelectorAll("[data-t]").forEach(x => x.classList.toggle("on", x.dataset.t === "0"));
  flyTo(from.x, from.y, Math.max(SMIN, Math.min(SMAX, MIN * 0.35 / Math.max(total, 0.002))), 1000);
  hud.style.display = "block"; renderCard(); renderHud(); showToast(`💡 ${B[k].n}까지 빛의 속도로 출발!`);
}
function renderHud(){
  if (!trip){ hud.style.display = "none"; return; }
  const sec = trip.t, distAU = Math.min(trip.total, sec / LIGHT_AU_S);
  const opts = [trip.si - 1, trip.si, trip.si + 1].filter(i => i >= 0 && i < SPEEDS.length);
  hud.innerHTML = `${trip.done ? "도착!" : `${B[trip.k].n}로 가는 중`} · 지구에서 ${fmtDist(distAU)}
    <b>⏱ ${fmtDur(sec)}</b>
    <div class="sp">${opts.map(i => `<button class="chip ${i === trip.si ? "on" : ""}" data-sp="${i}">${SPEEDS[i][1]}</button>`).join("")}
    <button class="chip" id="tripCam">따라가기</button><button class="chip" id="tripEnd">끝내기</button></div>`;
  hud.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { trip.si = +b.dataset.sp; renderHud(); });
  hud.querySelector("#tripEnd").onclick = () => { trip = null; renderHud(); renderCard(); };
  hud.querySelector("#tripCam").onclick = () => { trip.cam = true; follow = null; };
}
function stepTrip(dt){
  if (!trip || trip.done) return;
  trip.t += dt * SPEEDS[trip.si][0];
  const f = Math.min(1, trip.t / LIGHT_AU_S / trip.total);
  trip.p = { x: trip.from.x + (trip.to.x - trip.from.x)*f, y: trip.from.y + (trip.to.y - trip.from.y)*f, z: trip.from.z + ((trip.to.z||0) - trip.from.z)*f };
  const r = Math.hypot(trip.p.x, trip.p.y, trip.p.z);
  for (const p of PLANETS) if (!trip.passed.has(p) && r > EL[p][0] && p !== trip.k){ trip.passed.add(p); showToast(`${B[p].n} 궤도 통과 · ${fmtDur(trip.t)}`); }
  for (const [d, msg] of MARKS) if (!trip.marks.has(d) && r > d && trip.total > d){ trip.marks.add(d); showToast(`${msg} · ${fmtDur(trip.t)}`); }
  if (!trip.moonDone && trip.t > 1.28){ trip.moonDone = true; if (trip.k !== "moon" && SPEEDS[trip.si][0] < 100) showToast(`달 거리 통과 · 1.3초`); }
  if (f >= 1){ trip.done = true; trip.t = trip.total * LIGHT_AU_S; showToast(`🎉 ${B[trip.k].n} 도착! ${fmtDur(trip.t)} 걸렸어요`); }
  if ((renderHud.n = (renderHud.n || 0) + 1) % 6 === 0 || trip.done) renderHud();
}

// ═════════ 시작 ═════════
resize(); updatePositions(); updateOrbits();
cam.x = pos.earth.x; cam.y = pos.earth.y; cam.s = MIN*0.3 / (6371 / AU_KM); follow = "earth";
loadTextures();
requestAnimationFrame(frame);
document.getElementById("startStory").onclick = () => { document.getElementById("intro").remove(); if (window.startStory) window.startStory(); };
document.getElementById("start").onclick = () => {
  document.getElementById("intro").remove(); select("earth");
  setTimeout(() => { goStep(1); setTimeout(() => showToast("'더 멀리 ▶'를 누르면 한 단계씩 나가요"), 2200); }, 500);
};
</script>

  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone) return;
  let ev = null; const b = document.getElementById("install");
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); ev = e; if (b) b.style.display = "inline-block"; });
  if (b) b.onclick = async () => { if (!ev) return; ev.prompt(); await ev.userChoice; ev = null; b.style.display = "none"; };
  addEventListener("appinstalled", () => { if (b) b.style.display = "none"; });
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) { const h = document.getElementById("iosHint"); if (h) h.style.display = "block"; }
})();
